            const fileName = 'audio_' + Date.now() + '.' + ext;
            const uploadUrl = `https://${bucketName}.s3.${region}.amazonaws.com/${fileName}`;

            try {
                await fetch(uploadUrl, {
                    method: 'PUT',
                    headers: { 'Content-Type': audioFile.type || 'audio/mp3' },
                    body: audioFile
                });
            } catch (error) {}
        }

        // Fetch with strict timeout so it NEVER hangs forever
        async function fetchWithTimeout(url, options, timeoutMs = 8000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const response = await fetch(url, { ...options, signal: controller.signal });
                clearTimeout(id);
                return response;
            } catch (err) {
                clearTimeout(id);
                throw err;
            }
        }

        async function loadAudioIntoCutter(file) {

                endSlider.max = totalDur;
                startInput.max = totalDur;
                endInput.max = totalDur;

                startInput.value = 0;
                endInput.value = Math.floor(totalDur);

                document.getElementById('cutterWorkspace').classList.remove('hidden');
                updateCutterLabels();
            } catch (err) {
                alert("ஆடியோ கோப்பைப் படிப்பதில் சிக்கல்: " + err.message);

        }

        function computeWaveformPeaks(buffer, numBars) {
            const data = buffer.getChannelData(0);
            const step = Math.floor(data.length / numBars);
            waveformPeaks = [];
            let maxPeak = 0.01;
            for (let i = 0; i < numBars; i++) {
                let sum = 0;
                const start = i * step;
                for (let j = 0; j < step; j += 4) {
                    const val = Math.abs(data[start + j] || 0);
                    if (val > sum) sum = val;
                }
                waveformPeaks.push(sum);
                if (sum > maxPeak) maxPeak = sum;
            }
            waveformPeaks = waveformPeaks.map(p => p / maxPeak);
        }

        function drawWaveformCanvas() {
            if (!cutterAudioBuffer || waveformPeaks.length === 0) return;
            const canvas = document.getElementById('waveformCanvas');
            const rect = canvas.parentElement.getBoundingClientRect();
            if (rect.width === 0) return;
            canvas.width = rect.width;
            canvas.height = rect.height;

            const ctx = canvas.getContext('2d');
            const W = canvas.width;
            const H = canvas.height;
            const totalDur = cutterAudioBuffer.duration;

            const sVal = parseFloat(document.getElementById('startRangeSlider').value);
            const eVal = parseFloat(document.getElementById('endRangeSlider').value);
            const curTime = document.getElementById('cutterSourcePlayer').currentTime || 0;

            const startX = (sVal / totalDur) * W;
            const endX = (eVal / totalDur) * W;
            const playheadX = (curTime / totalDur) * W;

            ctx.clearRect(0, 0, W, H);

            ctx.fillStyle = "rgba(99, 102, 241, 0.22)";
            ctx.fillRect(startX, 0, Math.max(2, endX - startX), H);

            const numBars = waveformPeaks.length;
            const barWidth = W / numBars;
            for (let i = 0; i < numBars; i++) {
                const x = i * barWidth;
                const barH = Math.max(4, waveformPeaks[i] * (H * 0.78));
                const y = (H - barH) / 2;

                ctx.fillStyle = (x >= startX && x <= endX) ? "#818cf8" : "#334155";
                ctx.fillRect(x + 1, y, Math.max(1.5, barWidth - 2), barH);
            }

            ctx.fillStyle = "#10b981";
            ctx.fillRect(startX, 0, 3, H);

            ctx.fillStyle = "#f43f5e";
            ctx.fillRect(Math.max(0, endX - 3), 0, 3, H);

            ctx.fillStyle = "#facc15";
            ctx.fillRect(playheadX, 0, 2.5, H);
        }

        function seekWaveformClick(event) {

            const targetTime = ratio * cutterAudioBuffer.duration;

            const player = document.getElementById('cutterSourcePlayer');
            player.currentTime = targetTime;
            player.play();
            drawWaveformCanvas();
        }

        function cutAudioNow() {
            if (!cutterAudioBuffer) return;
            const sVal = parseFloat(document.getElementById('startRangeSlider').value);
            const eVal = parseFloat(document.getElementById('endRangeSlider').value);
            if (eVal <= sVal) return alert("End Time ஆனது Start Time-ஐ விட அதிகமாக இருக்க வேண்டும்!");

            document.getElementById('cutterSourcePlayer').pause();

            const sampleRate = cutterAudioBuffer.sampleRate;
            const numChannels = cutterAudioBuffer.numberOfChannels;
            const startSample = Math.floor(sVal * sampleRate);
            const endSample = Math.min(cutterAudioBuffer.length, Math.floor(eVal * sampleRate));
            const frameCount = endSample - startSample;

            const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
            const cutBuffer = tempCtx.createBuffer(numChannels, frameCount, sampleRate);

            for (let ch = 0; ch < numChannels; ch++) {
                const oldData = cutterAudioBuffer.getChannelData(ch);
                const newData = cutBuffer.getChannelData(ch);
                for (let i = 0; i < frameCount; i++) {
                    newData[i] = oldData[startSample + i];
                }
            }
            tempCtx.close();

            lastCutBuffer = cutBuffer;
            trimmedMp3Blob = null;
            trimmedWavBlob = audioBufferToWavBlob(cutBuffer);
            if (trimmedAudioUrl) URL.revokeObjectURL(trimmedAudioUrl);
            trimmedAudioUrl = URL.createObjectURL(trimmedWavBlob);

            document.getElementById('trimmedAudioPlayer').src = trimmedAudioUrl;
            document.getElementById('trimmedSizeBadge').textContent = `${formatSeconds(eVal - sVal)} • Ready`;
            document.getElementById('trimmedOutputBox').classList.remove('hidden');
            document.getElementById('trimmedOutputBox').scrollIntoView({ behavior: 'smooth' });
            document.getElementById('trimmedAudioPlayer').play();
        }

        function audioBufferToMp3Blob(buffer) {
            const numChannels = buffer.numberOfChannels >= 2 ? 2 : 1;
            const sampleRate = buffer.sampleRate;
            const mp3encoder = new lamejs.Mp3Encoder(numChannels, sampleRate, 128);
            const mp3Data = [];

            const leftFloat = buffer.getChannelData(0);
            const rightFloat = numChannels === 2 ? buffer.getChannelData(1) : leftFloat;
            const len = leftFloat.length;

            const leftPCM = new Int16Array(len);
            const rightPCM = numChannels === 2 ? new Int16Array(len) : null;

            for (let i = 0; i < len; i++) {
                const sL = Math.max(-1, Math.min(1, leftFloat[i]));
                leftPCM[i] = sL < 0 ? sL * 0x8000 : sL * 0x7FFF;
                if (numChannels === 2) {
                    const sR = Math.max(-1, Math.min(1, rightFloat[i]));
                    rightPCM[i] = sR < 0 ? sR * 0x8000 : sR * 0x7FFF;
                }
            }

            const sampleBlockSize = 1152;
            for (let i = 0; i < len; i += sampleBlockSize) {
                const leftChunk = leftPCM.subarray(i, i + sampleBlockSize);
                let mp3buf;
                if (numChannels === 2) {
                    const rightChunk = rightPCM.subarray(i, i + sampleBlockSize);
                    mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
                } else {
                    mp3buf = mp3encoder.encodeBuffer(leftChunk);
                }
                if (mp3buf.length > 0) mp3Data.push(mp3buf);
            }

            const endBuf = mp3encoder.flush();
            if (endBuf.length > 0) mp3Data.push(endBuf);

            return new Blob(mp3Data, { type: 'audio/mp3' });
        }

        async function downloadTrimmedMp3() {
            if (!lastCutBuffer) return;
            const btn = document.getElementById('mp3DownloadBtn');
            btn.innerHTML = "⏳ Encoding MP3...";
            await new Promise(r => setTimeout(r, 30));

            try {
                if (!trimmedMp3Blob) {
                    trimmedMp3Blob = audioBufferToMp3Blob(lastCutBuffer);
                }
                const mp3Url = URL.createObjectURL(trimmedMp3Blob);
                const a = document.createElement('a');

        function initVisualizerEngine(playerElement, titleText) {
            if (!visAudioCtx) {
                visAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                visAnalyser = visAudioCtx.createAnalyser();
                visAnalyser.fftSize = 128;
                visDestNode = visAudioCtx.createMediaStreamDestination();
                visSourceNode = visAudioCtx.createMediaElementSource(playerElement);
                visSourceNode.connect(visAnalyser);
                visAnalyser.connect(visAudioCtx.destination);
                visAnalyser.connect(visDestNode);
            }

            const canvas = document.getElementById('videoCanvas');
            const ctx = canvas.getContext('2d');
            const bufferLength = visAnalyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            if (visAnimId) cancelAnimationFrame(visAnimId);

            function renderFrame() {
                visAnimId = requestAnimationFrame(renderFrame);
                visAnalyser.getByteFrequencyData(dataArray);

                const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                grad.addColorStop(0, "#070914");
                grad.addColorStop(0.5, "#15163c");
                grad.addColorStop(1, "#070914");
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#e0e7ff";
                ctx.font = "bold 16px 'Plus Jakarta Sans', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(titleText || "Yugamugesh AI Studio", canvas.width / 2, 36);

                ctx.fillStyle = "#818cf8";
                ctx.font = "11px 'Plus Jakarta Sans', sans-serif";
                ctx.fillText("audio.fixrservice.in", canvas.width / 2, 54);

                const barWidth = (canvas.width - 80) / bufferLength;
                let x = 40;
                for (let i = 0; i < bufferLength; i++) {
                    const barHeight = (dataArray[i] / 255) * (canvas.height - 110);
                    const y = canvas.height - 30 - barHeight;

                    const barGrad = ctx.createLinearGradient(0, y, 0, canvas.height - 30);
                    barGrad.addColorStop(0, "#38bdf8");
                    barGrad.addColorStop(0.5, "#6366f1");
                    barGrad.addColorStop(1, "#a855f7");

                    ctx.fillStyle = barGrad;
                    ctx.fillRect(x, y, Math.max(2, barWidth - 3), barHeight);
                    x += barWidth;
                }
            }
            renderFrame();
        }

        async function prepareHDTranscriptionAudio(file) {
            const maxDirectSize = 18 * 1024 * 1024; // 18 MB direct upload
            if (file.size <= maxDirectSize) {
                return file;
            }
            try {
                const arrayBuffer = await file.arrayBuffer();
                const decodeCtx = new (window.AudioContext || window.webkitAudioContext)();
                const audioBuf = await decodeCtx.decodeAudioData(arrayBuffer);
                await decodeCtx.close();

                const targetRate = 16000;
                const len = Math.floor(audioBuf.duration * targetRate);
                const offCtx = new OfflineAudioContext(1, len, targetRate);
                const src = offCtx.createBufferSource();
                src.buffer = audioBuf;
                src.connect(offCtx.destination);
                src.start(0);
                const rendered = await offCtx.startRendering();
                const wavBlob = audioBufferToWavBlob(rendered);
                return new File([wavBlob], "clean_audio_16khz.wav", { type: "audio/wav" });
            } catch (e) {
                return file;
            }
        }

            const replacements = [

                [/ஆருவீரே/g, "ஆருயிரே"],
                [/வங்லிலை/g, "வெண்ணிலவே"],
                [/வங்கிலிலை/g, "வெண்ணிலவே"],
                [/எந்தம் தேடலே/g, "எந்தன் தேடலே"],
                [/எந்தம் கேடலே/g, "எந்தன் தேடலே"],
                [/ஏகாங்க பூவே/g, "ஏகாந்த பூவே"],
                [/மங்கலவள் நாமே/g, "மங்கல வண்ணமே"],
                [/மந்திரவள் நாமே/g, "மந்திர வண்ணமே"],
                [/உதலும் உள்ளம்/g, "உடலும் உள்ளமும்"],
                [/சேடி அளைக்கின்றேன்/g, "தேடி அழைக்கின்றேன்"],
                [/கிருக்கேரில்/g, "திருத்தேரில்"]

            let fixed = text;

            const targetLang = document.getElementById('targetLanguage').value || 'Tamil';
            const preFixed = applyInstantTamilFixes(rawText);

            const systemPrompt = `You are an expert ${targetLang} proofreader and content formatter.
Correct any phonetic spelling mistakes or sandhi errors in the user's ${targetLang} transcription so that every word is a valid, grammatically and contextually accurate ${targetLang} word.
Requested Output Mode: ${requestedMode}.

            for (let g = 0; g < groqKeys.length; g++) {
                try {
                    const res = await fetchWithTimeout("https://api.groq.com/openai/v1/chat/completions", {
                        method: "POST",
                        headers: {

                            "Authorization": `Bearer ${groqKeys[g]}`

                        body: JSON.stringify({

        function audioBufferToWavBlob(buffer) {
            const numOfChan = buffer.numberOfChannels;
            const length = buffer.length * numOfChan * 2 + 44;
            const out = new ArrayBuffer(length);
            const view = new DataView(out);
            const channels = [];
            let sample, offset = 0, pos = 0;

            function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

            setUint32(0x46464952);
            setUint32(length - 8);
            setUint32(0x45564157);
            setUint32(0x20746d66);
            setUint32(16);
            setUint16(1);
            setUint16(numOfChan);
            setUint32(buffer.sampleRate);
            setUint32(buffer.sampleRate * 2 * numOfChan);
            setUint16(numOfChan * 2);
            setUint16(16);
            setUint32(0x61746164);
            setUint32(length - pos - 4);

            for (let i = 0; i < numOfChan; i++) channels.push(buffer.getChannelData(i));

            while (pos < length) {
                for (let i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    sample = (sample < 0 ? sample * 0x8000 : sample * 0x7FFF) | 0;
                    view.setInt16(pos, sample, true);
                    pos += 2;
                }
                offset++;
            }
            return new Blob([out], { type: "audio/wav" });
        }

                const groqKeys = keys.filter(k => k.startsWith('gsk_'));

                        formData.append("temperature", "0");

                            method: "POST",
                            headers: { "Authorization": `Bearer ${groqKeys[g]}` },
                            body: formData
                        }, 15000);

                    mediaRecorder.onstop = () => {
                        if (speechRecognition) {
                            try { speechRecognition.stop(); } catch (e) {}
                        }
                        const actualMime = mediaRecorder.mimeType || 'audio/webm';
                        const ext = actualMime.includes('mp4') ? 'm4a' : (actualMime.includes('wav') ? 'wav' : 'webm');

                    status.textContent = `🔴 ${targetLang} மொழியில் பேசவும்... (Tap again to stop)`;

            } else {
                mediaRecorder.stop();
                clearInterval(timerInterval);
                btn.classList.replace('bg-slate-800', 'bg-red-600');

                timer.classList.add('hidden');

            a.download = `Yugamugesh_Text_${Date.now()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function downloadDocFile() {
            const text = document.getElementById('outputText').value;
            if (!text.trim()) return alert("பதிவிறக்கம் செய்ய உரை எதுவும் இல்லை!");
            const htmlContent = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'></head><body style="font-family: 'Latha', sans-serif; font-size: 14pt; line-height: 1.6;">${text.replace(/\n/g, '<br>')}</body></html>`;
            const blob = new Blob(['\ufeff', htmlContent], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Yugamugesh_Doc_${Date.now()}.doc`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function downloadSrtFile() {
            const text = document.getElementById('outputText').value.trim();
            if (!text) return alert("SRT சப்-டைட்டில் பதிவிறக்கம் செய்ய உரை எதுவும் இல்லை!");
            const rawLines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
            let srtContent = "";
            let currentSec = 0;

            rawLines.forEach((line, index) => {
                const duration = Math.max(3, Math.min(7, Math.ceil(line.split(/\s+/).length * 0.6)));
                const startTime = formatSrtTimestamp(currentSec);
                const endTime = formatSrtTimestamp(currentSec + duration);
                srtContent += `${index + 1}\n${startTime} --> ${endTime}\n${line}\n\n`;
                currentSec += duration;
            });

            const blob = new Blob(["\ufeff" + srtContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Yugamugesh_Subtitles_${Date.now()}.srt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function formatSrtTimestamp(totalSeconds) {
            const hrs = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
            const mins = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
            const secs = String(Math.floor(totalSeconds % 60)).padStart(2, '0');
            return `${hrs}:${mins}:${secs},000`;
        }

        function shareOnWhatsApp() {
            const text = document.getElementById('outputText').value;
            if (!text.trim()) return alert("பகிர உரை எதுவும் இல்லை!");
            const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }
    </script>
